modLoader="javafml" #mandatory
loaderVersion="${forge_loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="${license}"
issueTrackerURL="https://github.com/FoundryMC/Veil/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${version}" #mandatory
displayName="${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
displayURL="https://modrinth.com/project/veil" #optional
logoFile="icon.png" #optional
credits="${mod_contributor}" #optional
authors="${mod_author}" #optional
description='''${description}'''

# Mixin configs are declared through the MixinConfigs jar manifest attribute (see forge/build.gradle)

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=false
    versionRange="[0.3.31,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="oculus"
    mandatory=false
    versionRange="[1.8.0,)"
    ordering="NONE"
    side="CLIENT"
